function cardInfo(card,industry){const t=TYPES[card.type],i=INDUSTRIES[industry];return {...t,name:card.label||(card.type==='employee'?i.names.person:i.names[card.type])||t.name,icon:i.icons[card.type]||t.icon};}

const VERSION=1;
const copy=x=>JSON.parse(JSON.stringify(x));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class Game {
 constructor(industry='software',snapshot=null){
  this.events=[];
  if(snapshot){this.s=copy(snapshot);this.validate();return;}
  if(!INDUSTRIES[industry])throw new Error('请选择有效的行业');
  this.s={version:VERSION,industry,cash:INDUSTRIES[industry].cash,month:1,seconds:120,paused:false,speed:1,started:false,over:false,won:false,cards:{},stacks:[],nextId:1,packs:{},queue:[],rng:(Date.now()>>>0)||123456789,redraw:1,deliveries:0,research:0,produced:0,round:-1,equity:100,capTable:[{name:'创始团队',share:100}],health:85,subscribers:0,history:[],monthIncome:0,monthExpense:0,monthly:null,loans:[],rescueUsed:false,flags:{},log:[],known:[]};
  this.createPack(-1,['founder','market','tool','material','cash'],620,180);
 }
 validate(){const s=this.s;if(s.version!==VERSION||!INDUSTRIES[s.industry]||!Array.isArray(s.stacks)||!s.cards||!Array.isArray(s.queue)||!Number.isFinite(s.cash)||!Number.isFinite(s.month))throw new Error('存档版本不兼容');const all=s.stacks.flatMap(x=>x.cards);if(all.some(id=>!s.cards[id])||new Set(all).size!==all.length||Object.keys(s.cards).length!==all.length)throw new Error('存档卡牌记录不完整');}
 snapshot(){return copy(this.s);}
 emit(type,data={}){this.events.push({type,...data});}
 drain(){return this.events.splice(0);}
 log(text){this.s.log.unshift({month:this.s.month,text});this.s.log=this.s.log.slice(0,30);}
 toast(text,error=false){this.emit('toast',{text,error});}
 random(){let x=this.s.rng;x^=x<<13;x^=x>>>17;x^=x<<5;this.s.rng=x>>>0;return this.s.rng/4294967296;}
 id(prefix){return prefix+this.s.nextId++;}
 person(c){return c.type==='founder'||c.type==='employee';}
 stack(id){return this.s.stacks.find(s=>s.id===id);}
 stackOf(id){return this.s.stacks.find(s=>s.cards.includes(id));}
 all(type){return Object.values(this.s.cards).filter(c=>c.type===type);}
 capacity(){return 20+this.all('office').length*4;}
 count(){return Object.values(this.s.cards).filter(c=>!['cash','pack','report','pending','receivable'].includes(c.type)).length;}
 expenses(){return INDUSTRIES[this.s.industry].rent+this.all('employee').length*INDUSTRIES[this.s.industry].wage+this.all('office').length*500+(this.s.industry==='software'?this.s.subscribers*250:0);}
 position(x=500,y=180,avoid=true){x=clamp(x,268,1156);y=clamp(y,10,335);if(avoid){for(let tries=0;tries<30&&this.s.stacks.some(s=>Math.abs(s.x-x)<75&&Math.abs(s.y-y)<100);tries++){x+=120;if(x>1156){x=278;y+=155;if(y>335)y=12;}}}return {x,y};}
 add(type,x=500,y=180,data={}){if(!TYPES[type])throw new Error('未知卡牌');const id=this.id('c');const card={id,type,born:this.s.month,...data};if(type==='market'&&card.charges===undefined)card.charges=4;if(type==='employee'&&card.efficiency===undefined)card.efficiency=1;if(type==='order'&&card.amount===undefined){card.amount=INDUSTRIES[this.s.industry].unit;card.lag=INDUSTRIES[this.s.industry].lag;}this.s.cards[id]=card;const pos=this.position(x,y);this.s.stacks.push({id:this.id('s'),...pos,cards:[id],job:null});this.emit('card',{id});return card;}
 remove(id){const stack=this.stackOf(id);if(stack){stack.cards=stack.cards.filter(c=>c!==id);if(stack.job){stack.job=null;}if(!stack.cards.length)this.s.stacks=this.s.stacks.filter(s=>s!==stack);}delete this.s.cards[id];}
 spend(amount,reason){if(this.s.cash<amount)throw new Error('现金不足，需要 '+money(amount));this.s.cash-=amount;this.s.monthExpense+=amount;this.log(reason+' −'+money(amount));}
 receive(amount,reason,income=true){this.s.cash+=amount;if(income)this.s.monthIncome+=amount;this.log(reason+' +'+money(amount));this.emit('money',{amount});}
 createPack(shop,types,x,y){const id=this.id('p');const p={id,shop,types:[...types],results:[],opened:false,redrawn:false,opening:false};this.s.packs[id]=p;return this.add('pack',x,y,{packId:id,label:shop===-1?'创业启动包':SHOPS[shop].name});}
 rollPack(shop){const p=SHOPS[shop];return [...p.fixed,p.pool[Math.floor(this.random()*p.pool.length)]];}
 buy(shop){const p=SHOPS[shop];if(!p)throw new Error('商店不存在');if(this.s.over||this.s.monthly?.deficit)throw new Error('先处理当前结算');if(this.s.deliveries<p.unlock)throw new Error(`完成 ${p.unlock} 笔交付后解锁`);if(this.count()>this.capacity()+8)throw new Error('桌面太拥挤，先整理或扩容');this.spend(p.price,'购买'+p.name);const card=this.createPack(shop,this.rollPack(shop),400+shop*105,22);this.toast(p.name+'已送到桌面，点击开包');return card;}
 openPack(id){const c=this.s.cards[id];if(c?.type!=='pack')throw new Error('请选择一个卡包');const p=this.s.packs[c.packId];if(p.opened)throw new Error('卡包已经打开');const st=this.stackOf(id),x=st.x,y=st.y;p.opened=true;p.opening=true;this.remove(id);p.types.forEach((type,i)=>this.s.queue.push({type,remaining:i*.4,packId:p.id,x:x+(i%3-1)*120,y:y+Math.floor(i/3)*142}));this.s.started=true;this.log('打开'+(p.shop<0?'创业启动包':SHOPS[p.shop].name));this.emit('open');}
 canRedraw(packId){const p=this.s.packs[packId];if(!p||p.shop<0||!p.opened||p.opening)return '这个包暂不能重抽';if(p.redrawn)return '每包最多重抽一次';if(this.s.redraw<=0)return '本月重抽次数已用完';if(!p.results.length||p.results.some(id=>!this.s.cards[id]||this.s.cards[id].used))return '包中已有卡牌使用或出售，不能重抽';return null;}
 redraw(packId){const error=this.canRedraw(packId);if(error)throw new Error(error);const p=this.s.packs[packId];const card=p.results.map(id=>this.s.cards[id])[0];const st=this.stackOf(card.id);const x=st.x,y=st.y;p.results.forEach(id=>this.remove(id));p.results=[];p.types=this.rollPack(p.shop);p.redrawn=true;p.opening=true;this.s.redraw--;p.types.forEach((type,i)=>this.s.queue.push({type,remaining:i*.4,packId:p.id,x:x+(i%3-1)*120,y:y+Math.floor(i/3)*142}));this.toast('整包重新寻源，本月剩余 '+this.s.redraw+' 次');this.log('使用本月重抽机会');}
 split(cardId){const st=this.stackOf(cardId);if(!st)throw new Error('找不到卡牌');const index=st.cards.indexOf(cardId);if(st.job){st.job=null;this.toast('作业已中断；已发生的外部费用不退回');}if(index===0)return st;const ids=st.cards.splice(index),newStack={id:this.id('s'),x:st.x,y:clamp(st.y+index*30,0,340),cards:ids,job:null};this.s.stacks.push(newStack);return newStack;}
 move(id,x,y){const st=this.stack(id);if(!st)return;st.x=clamp(x,5,1166);st.y=clamp(y,4,Math.max(4,460-132-(st.cards.length-1)*30));}
 merge(from,to){const a=this.stack(from),b=this.stack(to);if(!a||!b||a===b)return false;if(a.cards.length+b.cards.length>8)throw new Error('单堆最多8张，请拆分调度');if(a.cards.some(id=>['cash','pack','pending','term','receivable'].includes(this.s.cards[id].type))||b.cards.some(id=>['cash','pack','pending','term','receivable'].includes(this.s.cards[id].type)))throw new Error('这些卡牌需要单独查看或使用');a.job=null;b.job=null;b.cards.push(...a.cards);this.s.stacks=this.s.stacks.filter(s=>s!==a);this.move(b.id,b.x,b.y);return true;}
 recipeCards(st,r){const needed=[...r.types];if(r.id==='production'&&this.s.industry!=='software')needed.push('material');if(st.cards.length!==needed.length)return null;const cards=st.cards.map(id=>this.s.cards[id]);const used=new Set(),out=[];for(const t of needed){const c=cards.find(c=>!used.has(c.id)&&(t==='person'?this.person(c):c.type===t));if(!c)return null;out.push(c);used.add(c.id);}return out;}
 match(st){for(const r of RECIPES){const cards=this.recipeCards(st,r);if(cards)return {r,cards};}return null;}
 financeRequirement(){const next=ROUNDS[this.s.round+1];if(!next)return '已完成 B 轮';if(this.all('pending').length||this.all('term').length)return '请先处理现有融资报价';if(this.s.deliveries<next.deals)return `${next.name}需要累计 ${next.deals} 笔真实交付（当前${this.s.deliveries}笔）`;if(this.s.month<next.month)return `${next.name}需要经营到第 ${next.month} 月`;if(this.s.health<50)return '经营口碑低于50，请先解决危机';return null;}
 startJobs(skip){if(this.s.monthly||this.s.over)return;for(const st of this.s.stacks){if(st.id===skip||st.job)continue;const m=this.match(st);if(!m)continue;const {r,cards}=m;let blocked=null;if(r.id==='roadshow')blocked=this.financeRequirement();if(r.id==='train'&&cards.find(c=>c.type==='employee').efficiency>=1.6)blocked='员工已完成本阶段培训';let cost=r.cost||0;if(r.id==='production'&&this.s.industry==='software')cost=INDUSTRIES.software.cost;if(this.s.cash<cost)blocked='现金不足，无法开始作业';if(blocked){if(st.blocked!==blocked)this.toast(blocked,true);st.blocked=blocked;continue;}st.blocked=null;if(cost)this.spend(cost,r.name);cards.forEach(c=>c.used=true);const efficiency=cards.find(c=>this.person(c))?.efficiency||1;st.job={recipe:r.id,total:r.duration/efficiency,left:r.duration/efficiency,ids:cards.map(c=>c.id)};if(!this.s.known.includes(r.id))this.s.known.push(r.id);this.emit('job',{stack:st.id,recipe:r.id});}}
 finish(st){const job=st.job;if(!job)return;const r=RECIPES.find(r=>r.id===job.recipe),cards=job.ids.map(id=>this.s.cards[id]);st.job=null;if(cards.some(c=>!c))return;const x=st.x+124,y=st.y;const get=t=>cards.find(c=>c.type===t);let outputs=[...r.out];let consumes=[...r.consume];if(r.id==='research'){this.s.research++;get('market').charges--;if(get('market').charges<=0)consumes.push('market');}
  if(r.id==='production'){this.s.produced++;if(this.s.industry!=='software')consumes.push('material');if(!this.s.flags.firstProduct){this.s.flags.firstProduct=true;this.add('order',x+120,y);this.toast('产品做好了！第一位客户带来了试单。');}}
  if(r.id==='delivery'){const order=get('order');let amount=Math.round(order.amount*(this.s.health<60?.85:1));if(this.s.industry!=='software')consumes.push('product');else this.s.subscribers++;if(order.lag>0){this.add('receivable',x,y,{amount,due:this.s.month+order.lag});this.toast('交付完成：'+money(amount)+'，'+order.lag+'个月后回款');this.log('新增应收账款 '+money(amount));}else{this.receive(amount,'完成客户交付');this.toast('第一性原理：有人愿意付钱。+'+money(amount));}this.s.deliveries++;this.s.health=clamp(this.s.health+2,0,100);this.s.flags.firstSale=true;if(!this.all('report').length)this.add('report',x+110,y);if(this.s.deliveries===1){this.add('scheme',x+220,y);this.toast('首次交付完成，供应采购和产品研发已解锁');}if(this.s.deliveries===3){this.add('investor',x+120,y);this.toast('3笔真实交付，一位天使投资人想和你聊聊。');}if([5,12,20].includes(this.s.deliveries)){this.add('space',x+240,y);}}
  if(r.id==='repair'){this.s.health=clamp(this.s.health+12,0,100);this.toast('危机已处理，口碑恢复');}
  if(r.id==='train'){get('employee').efficiency=Math.min(1.6,get('employee').efficiency+.2);this.toast('培训完成，工作效率提高');}
  for(const t of consumes){const c=get(t);if(c)this.remove(c.id);}
  for(const type of outputs){const data=type==='term'?{round:this.s.round+1}:{};this.add(type,x,y,data);}
  this.emit('complete',{recipe:r.id,x,y});
 }
 acceptTerm(id){const c=this.s.cards[id];if(c?.type!=='term')throw new Error('请选择投资意向书');if(c.round!==this.s.round+1||this.all('pending').length)throw new Error('该报价已经失效');const r=ROUNDS[c.round];const st=this.stackOf(id);this.remove(id);this.add('pending',st.x,st.y,{round:c.round,due:this.s.month+1,amount:r.amount,pre:r.pre});this.toast('签约成功，下一经营月结算后交割到账');this.log('接受'+r.name+'报价，等待交割');}
 rejectTerm(id){if(this.s.cards[id]?.type!=='term')throw new Error('无有效报价');this.remove(id);this.toast('已拒绝本轮报价，可以继续经营或再次路演');}
 sellQuote(ids){const cards=ids.map(id=>this.s.cards[id]);if(cards.some(c=>!c))throw new Error('卡牌不存在');if(cards.some(c=>!TYPES[c.type].sell||(c.type==='product'&&this.s.industry==='software')))throw new Error('人员、客户、账款和软件版本不能直接出售');return cards.reduce((n,c)=>n+(c.type==='product'?Math.round(INDUSTRIES[this.s.industry].unit*.3):TYPES[c.type].sell),0);}
 sell(ids){const amount=this.sellQuote(ids);ids.forEach(id=>this.remove(id));this.receive(amount,'处置闲置资产',false);this.toast('处置完成 +'+money(amount));return amount;}
 archive(id){const c=this.s.cards[id];if(!c||!['demand','scheme','candidate','market','order','pitch'].includes(c.type))throw new Error('这张卡不能归档');this.remove(id);this.toast('已放弃这项机会，不产生收入');}
 tidy(){let i=0;for(const st of this.s.stacks){st.x=276+(i%7)*137;st.y=15+Math.floor(i/7)*175;if(st.y>320)st.y=320;this.move(st.id,st.x,st.y);i++;}this.toast('已按卡堆整理桌面，堆内顺序保留');}
 assemble(recipeId){const r=RECIPES.find(r=>r.id===recipeId);if(!r)throw new Error('配方不存在');const needed=[...r.types];if(recipeId==='production'&&this.s.industry!=='software')needed.push('material');const chosen=[],available=Object.values(this.s.cards);for(const t of needed){const c=available.find(c=>!chosen.includes(c.id)&&(t==='person'?this.person(c):c.type===t)&&!this.stackOf(c.id)?.job);if(!c)throw new Error('缺少可用卡牌：'+(t==='person'?'人员':TYPES[t].name));chosen.push(c.id);}for(const id of chosen){const st=this.stackOf(id);st.cards=st.cards.filter(c=>c!==id);if(!st.cards.length)this.s.stacks=this.s.stacks.filter(s=>s!==st);}const st={id:this.id('s'),x:550,y:60,cards:chosen,job:null};this.s.stacks.push(st);this.toast('已按方案摆好卡牌');return st;}

  for(const c of [...this.all('receivable')])if(c.due<=month){collection+=c.amount;this.receive(c.amount,'合同到期回款');this.remove(c.id);}
  for(const c of [...this.all('pending')])if(c.due<=month){const r=ROUNDS[c.round];const share=c.amount/(c.pre+c.amount);s.capTable.forEach(v=>v.share*=1-share);s.capTable.push({name:r.name+'投资人',share:share*100});s.equity=s.capTable[0].share;s.round=c.round;finance+=c.amount;this.receive(c.amount,r.name+'交割到账',false);this.remove(c.id);this.toast(r.name+'到账！创始团队持股'+s.equity.toFixed(1)+'%');}
  if(s.industry==='software'&&s.subscribers>0){const renew=Math.round(s.subscribers*1200*(s.health<60?.8:1));this.receive(renew,'订阅续费');}
  const operating=this.expenses();const loanDue=s.loans.filter(l=>l.due<=month&&!l.paid).reduce((n,l)=>n+l.amount,0);const cost=operating+loanDue;const income=s.monthIncome,expense=s.monthExpense+operating;const report={month,income,expense,cost,collection,finance,loanDue,cash:s.cash,deficit:Math.max(0,cost-s.cash),paid:false};s.monthly=report;s.paused=true;this.payMonthIfPossible();this.emit('month',{report:copy(s.monthly)});

function closeModal(){if($('#modal-layer').hidden)return;$('#modal-layer').hidden=true;$('#start-layer').inert=false;if(g&&modalResume&&!g.s.monthly&&!g.s.over)g.s.paused=false;modalMode='';lastFocus?.focus?.();render(true);}
function showTerm(id){const c=g.s.cards[id],r=ROUNDS[c.round],dilution=r.amount/(r.pre+r.amount),newShare=g.s.equity*(1-dilution);showModal(r.name+' · 投资意向书',`<p>投资人看到了你的真实交付。接受报价后进入尽调交割，资金将在第 ${g.s.month+1} 月末到账。</p><div class="quote-grid"><div><span>本次投资</span><b>${money(r.amount)}</b></div><div><span>投前估值</span><b>${money(r.pre)}</b></div><div><span>本轮出让</span><b>${(dilution*100).toFixed(1)}%</b></div></div><div class="status-note">创始团队持股：${g.s.equity.toFixed(1)}% → <strong>${newShare.toFixed(1)}%</strong><br>融资不是收入；意向书不能用来支付工资。试玩版采用简化的定价融资，金额为游戏参数。</div>`,`<button class="btn" data-reject="${id}">拒绝报价</button><button class="btn primary" data-accept="${id}">接受并等待交割</button>`);}
function showMonth(){g.payMonthIfPossible();const r=g.s.monthly;if(!r)return;showModal('第 '+r.month+' 月 · 经营月报',`<p>${r.deficit>0?'现金出现缺口，先处理到期付款。':r.paid?'工资、租金与到期账单已结清。':'正在结算到期账单。'}</p><p class="report-number">${money(g.s.cash)}</p><div class="report-grid"><div>客户实际回款<b>${money(r.income)}</b></div><div>本月经营现金支出<b>${money(r.expense)}</b></div><div>其中到期应收回款<b>${money(r.collection)}</b></div><div>融资实际到账<b>${money(r.finance)}</b></div><div>月末工资／租金及还款<b>${money(r.cost)}</b></div><div>累计交付<b>${g.s.deliveries} 单</b></div></div><p>这是现金收支简报，包含实际采购付款；不将它当作完整利润表。融资不计入客户收入。</p>${r.deficit>0?'<div class="status-note error-note">付款缺口 '+money(r.deficit)+'。可处置闲置资产，或使用本局一次的应急周转（3个月后偿还，费用5%）。</div>':''}${g.count()>g.capacity()?'<div class="status-note error-note">桌面超出容量 '+(g.count()-g.capacity())+' 张。返回桌面处置闲置卡牌或归档机会后继续。</div>':''}`,`<button class="btn" data-action="close">返回整理</button>${r.deficit>0?(g.s.rescueUsed?'':'<button class="btn" data-action="rescue">申请应急周转</button>')+'<button class="btn danger" data-action="fail-confirm">结束这次创业</button>':'<button class="btn primary" data-action="next-month">进入第 '+(g.s.month+1)+' 月 →</button>'}`,false,'month');}
function showRecipes(){showModal('经营方案',`<p>拖动卡牌组成下面的组合，进度条会自动出现。只选本配方的卡；多余卡片需要先拆开。也可以点击“摆好”辅助调度。</p>${RECIPES.map(r=>`<div class="recipe-row"><div class="equation"><b>${r.name}</b><br><small>${r.hint}</small></div><span class="tag">${r.duration}秒</span><button data-assemble="${r.id}">摆好卡片</button></div>`).join('')}<p>月末进行账单结算；打开窗口会暂停经营计时。速度按钮可以切换1×、2×、4×。</p>`,'<button class="btn primary" data-action="close">回到桌面堆叠</button>',true);}
function showHelp(){showModal('从五张卡，开始一家公司',`<div class="list-line"><strong>① 开包</strong>　点击启动包或商店购买的卡包，资源依次飞到桌面。</div><div class="list-line"><strong>② 堆叠</strong>　把创始人拖到市场上，获得需求。再把人员、工具和需求叠起来生产。</div><div class="list-line"><strong>③ 拆堆</strong>　拖住某张卡，会带走它和下面露出的后续卡。松手后自动寻找有效工作组合。</div><div class="list-line"><strong>④ 交付</strong>　人员＋产品＋订单。软件版本保留，实体商品消耗；零售和制造有回款等待。</div><div class="list-line"><strong>⑤ 留钱</strong>　每120秒一个经营月。工资和房租持续产生，别把账户全部拿去买包。</div><div class="list-line"><strong>⑥ 融资</strong>　3／10／24笔交付分别开启种子／A／B轮机会，还要满足经营月份和口碑要求。</div><p>无广告。每个经营月共享1次整包重抽，仅限尚未使用的卡包产物。空格暂停，1—7快捷购买，Esc关闭窗口。卡片也可用Enter查看，再通过经营方案辅助摆放。</p><div class="status-note">这是简单美术的机制样机。配方、现金与融资可玩；原APK的完整特殊章节和逐帧视觉还原尚未完成。</div>`,null,true);}
function showMenu(){if(!g){showHelp();return;}showModal('公司与存档',`<p>${INDUSTRIES[g.s.industry].name} · 第 ${g.s.month} 月 · 已交付 ${g.s.deliveries} 单</p><div class="list-line"><strong>股权账本</strong><br>${g.s.capTable.map(r=>escape(r.name)+' '+r.share.toFixed(1)+'%').join('　')}</div><div class="list-line"><strong>未来到期款项</strong><br>${g.all('receivable').map(c=>'应收 '+money(c.amount)+'（第'+c.due+'月末）').join('、')||'暂无应收账款'}<br>${g.s.loans.filter(l=>!l.paid).map(l=>'借款需还 '+money(l.amount)+'（第'+l.due+'月末）').join('、')||'暂无待还借款'}</div><div class="list-line"><strong>最近经营记录</strong><br>${g.s.log.slice(0,6).map(l=>'第'+l.month+'月 · '+escape(l.text)).join('<br>')||'公司刚刚开始。'}</div><p>进度只保存在当前浏览器，不需要账户，也不产生离线亏损。</p>`,`<button class="btn" data-action="exit">保存并回到行业选择</button><button class="btn" data-action="new">重新创业</button><button class="btn primary" data-action="save-close">保存并继续</button>`);}
function showEnd(won){showModal(won?'走到 B 轮，生意仍要继续。':'这次创业，先到这里。',`<p>${won?'你完成了三轮融资。钱和估值之外，继续经营好你的客户、团队与现金流。':'公司无法满足到期付款。看看现金是怎么花掉的，下次可以更早准备回款，或控制固定成本。'}</p><div class="quote-grid"><div><span>经营月份</span><b>${g.s.month} 月</b></div><div><span>累计交付</span><b>${g.s.deliveries} 单</b></div><div><span>创始团队持股</span><b>${g.s.equity.toFixed(1)}%</b></div></div><p>${g.s.log.slice(0,5).map(l=>escape(l.text)).join('<br>')}</p>`,(won?'<button class="btn primary" data-action="close">继续经营</button>':'')+'<button class="btn" data-action="new">再试一个行业</button>',false,'end');}
function sale(ids){try{const amount=g.sellQuote(ids);showModal('确认处置',`<p>${ids.map(id=>escape(info(g.s.cards[id]).name)).join('、')}</p><p class="report-number">${money(amount)}</p><p>按回收渠道报价成交。正常订单通常收益更高；处置设备会失去对应产能或容量。</p>`,`<button class="btn" data-action="close">保留</button><button class="btn primary" data-sale="${ids.join(',')}">确认处置</button>`);}catch(e){toast(e.message,true);}}
$('#shops').onclick=e=>{const b=e.target.closest('button');if(!b||!g)return;if(b.dataset.shop!==undefined){attempt(()=>g.buy(+b.dataset.shop));play();}else toast('把闲置设备、材料或实体产品拖到此处，先查看回收报价。');};
$('#pause-btn').onclick=()=>{if(!g)return;if(g.s.monthly){showMonth();return;}if(g.s.over){showEnd(false);return;}g.s.paused=!g.s.paused;render();save();};
$('#speed-btn').onclick=()=>{if(!g)return;g.s.speed=g.s.speed===1?2:g.s.speed===2?4:1;render();save();};
$('#tidy-btn').onclick=()=>g&&attempt(()=>g.tidy());$('#recipes-btn').onclick=()=>g&&showRecipes();$('#help-btn').onclick=showHelp;$('#menu-btn').onclick=showMenu;
$('#sound-btn').onclick=()=>{sound=!sound;try{localStorage.setItem(PREF,sound?'on':'off');}catch{}$('#sound-btn').textContent=sound?'♫':'♪';$('#sound-btn').setAttribute('aria-label',sound?'关闭音效':'开启音效');play();toast(sound?'示例音效已开启':'音效已关闭');};
function actionClick(e){const b=e.target.closest('button');if(!b)return;if(b.dataset.start){try{if(saved)localStorage.setItem(SAVE+'-backup',JSON.stringify(saved));}catch{}start(b.dataset.start);return;}if(!g&&b.dataset.action!=='close')return;const action=b.dataset.action;if(action==='close')return closeModal();if(action==='hide-selection'){$('#selection').hidden=true;selected=null;render(true);return;}if(b.dataset.assemble){const result=attempt(()=>g.assemble(b.dataset.assemble));if(result)closeModal();return;}if(b.dataset.redraw){attempt(()=>g.redraw(b.dataset.redraw));$('#selection').hidden=true;return;}if(b.dataset.archive){showModal('放弃这项机会？','<p>该卡将从桌面归档，不产生收入。已经签署的账款和到期付款不能这样删除。</p>',`<button class="btn" data-action="close">保留</button><button class="btn primary" data-confirm-archive="${b.dataset.archive}">确认归档</button>`);return;}if(b.dataset.confirmArchive){attempt(()=>g.archive(b.dataset.confirmArchive));closeModal();return;}if(b.dataset.sellCard){sale([b.dataset.sellCard]);return;}if(b.dataset.sale){attempt(()=>g.sell(b.dataset.sale.split(',')));closeModal();return;}if(b.dataset.accept){attempt(()=>g.acceptTerm(b.dataset.accept));closeModal();return;}if(b.dataset.reject){attempt(()=>g.rejectTerm(b.dataset.reject));closeModal();return;}if(b.dataset.dismiss){showModal('与员工结束合作','<p>支付一个月工资作为试玩版的离职结算。后续不再产生该员工工资，正在进行的作业会中断。</p>',`<button class="btn" data-action="close">保留员工</button><button class="btn danger" data-confirm-dismiss="${b.dataset.dismiss}">结算并离职</button>`);return;}if(b.dataset.confirmDismiss){attempt(()=>{const c=g.s.cards[b.dataset.confirmDismiss];if(c?.type!=='employee')throw new Error('员工已离开');g.spend(INDUSTRIES[g.s.industry].wage,'员工离职结算');g.remove(c.id);});closeModal();return;}
 if(action==='next-month'){const before=g.s.month;attempt(()=>g.nextMonth());if(g.s.month>before){closeModal();if(g.s.won&&!g.s.flags.shownWin){g.s.flags.shownWin=true;showEnd(true);}}return;}
 if(action==='rescue'){attempt(()=>g.rescue());showMonth();return;}if(action==='fail-confirm'){showModal('结束这次创业？','<p>进入经营复盘后，本公司停止运营；可以重新选择行业开始。</p>','<button class="btn" data-action="month">返回月报</button><button class="btn danger" data-action="fail">结束经营</button>');return;}if(action==='month'){showMonth();return;}if(action==='fail'){attempt(()=>g.fail());return;}
 if(action==='save-close'){save();closeModal();return;}if(action==='exit'||action==='new'){closeModal();g.s.paused=true;save();$('#start-layer').hidden=false;$('#continue-btn').hidden=false;return;}}
$('#modal').addEventListener('click',actionClick);$('#selection').addEventListener('click',actionClick);
function localPoint(e){const rect=board.getBoundingClientRect();return {x:(e.clientX-rect.left)/scale,y:(e.clientY-rect.top)/scale};}
cardLayer.onpointerdown=e=>{if(!g||g.s.over||e.button!==0)return;const n=e.target.closest('[data-card]');if(!n)return;const st=g.stackOf(n.dataset.card);drag={cardId:n.dataset.card,stackId:st.id,startX:e.clientX,startY:e.clientY,started:false,offsetY:st.cards.indexOf(n.dataset.card)*30};board.setPointerCapture(e.pointerId);e.preventDefault();};
board.onpointermove=e=>{if(!drag)return;const dx=(e.clientX-drag.startX)/scale,dy=(e.clientY-drag.startY)/scale;if(!drag.started&&Math.hypot(dx,dy)>5){const st=g.split(drag.cardId);drag.stackId=st.id;drag.originX=st.x;drag.originY=st.y;drag.started=true;render(true);play();}if(!drag.started)return;const st=g.stack(drag.stackId);if(!st)return;g.move(st.id,drag.originX+dx,drag.originY+dy);const n=document.getElementById(st.id);n.style.left=st.x+'px';n.style.top=st.y+'px';for(const b of document.querySelectorAll('.shop')){const r=b.getBoundingClientRect();b.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);}};
board.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;document.querySelectorAll('.shop.over').forEach(n=>n.classList.remove('over'));if(!d.started){select(d.cardId);return;}const st=g.stack(d.stackId);if(!st)return;let handled=false;for(const b of document.querySelectorAll('.shop')){const r=b.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)continue;handled=true;if(b.dataset.shop!==undefined){if(st.cards.length===1&&g.s.cards[st.cards[0]].type==='cash')attempt(()=>g.buy(+b.dataset.shop));else toast('拖入公司账户即可支付购买卡包',true);}else sale([...st.cards]);break;}
 if(!handled){const p=localPoint(e);const targets=g.s.stacks.filter(t=>t.id!==st.id&&p.x>=t.x-15&&p.x<=t.x+123&&p.y>=t.y-15&&p.y<=t.y+147+(t.cards.length-1)*30).sort((a,b)=>Math.hypot(p.x-a.x-54,p.y-a.y-66)-Math.hypot(p.x-b.x-54,p.y-b.y-66));if(targets[0]){const result=attempt(()=>g.merge(st.id,targets[0].id));if(result===null){const n=document.getElementById(st.id);n?.classList.add('bump');setTimeout(()=>n?.classList.remove('bump'),350);g.move(st.id,st.x+35,st.y+25);}}}
 render(true);processEvents();save();};
board.onpointercancel=()=>{drag=null;render(true);save();};
cardLayer.onkeydown=e=>{if(e.key==='Enter'){const n=e.target.closest('[data-card]');if(n){select(n.dataset.card);e.preventDefault();}}};
document.addEventListener('keydown',e=>{if(!$('#modal-layer').hidden){if(e.key==='Escape'){closeModal();e.preventDefault();}if(e.key==='Tab'){const nodes=[...$('#modal').querySelectorAll('button:not([disabled])')];if(nodes.length){const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}return;}if(!$('#start-layer').hidden)return;if(e.key===' '){e.preventDefault();$('#pause-btn').click();}if(e.key==='Escape'){$('#selection').hidden=true;selected=null;}if(/^[1-7]$/.test(e.key)&&g)attempt(()=>g.buy(+e.key-1));});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&g){g.s.paused=true;drag=null;save();render(true);}});addEventListener('beforeunload',save);
function frame(now){const dt=Math.min(.12,(now-(lastTime||now))/1000);lastTime=now;if(g&&$('#start-layer').hidden){g.tick(dt*g.s.speed,dt,drag?.started?drag.stackId:null);processEvents();if(now-lastRender>70){render();lastRender=now;}if(now-lastSave>1800){save();lastSave=now;}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
const context=document.modelContext;
if(context?.registerTool){const lifecycle=new AbortController();const tools=[
 {name:'read_game_state',description:'Read this local game company, cards, and current work. No changes.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(){return g?g.summary():{status:'Choose an industry to begin'};}},
 {name:'set_game_paused',description:'Pause or resume the current game, matching the pause control.',inputSchema:{type:'object',properties:{paused:{type:'boolean'}},required:['paused'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.paused!=='boolean')throw new Error('paused must be boolean');if(!g)throw new Error('No active game');if(!input.paused&&(g.s.monthly||g.s.over||!$('#modal-layer').hidden||!$('#start-layer').hidden))throw new Error('Close the dialog or finish settlement first');g.s.paused=input.paused;render();save();return {paused:g.s.paused};}},
 {name:'assemble_game_recipe',description:'Arrange currently available cards into a recipe, exactly like the recipe book Arrange button. Work begins when the game runs.',inputSchema:{type:'object',properties:{recipeId:{type:'string',enum:RECIPES.map(r=>r.id)}},required:['recipeId'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!g||!RECIPES.some(r=>r.id===input?.recipeId))throw new Error('Invalid recipe or no active game');if(g.s.over||g.s.monthly)throw new Error('Company cannot start work during settlement');const st=g.assemble(input.recipeId);render(true);processEvents();save();return {stack:st.id,cards:st.cards};}}
 ];for(const t of tools){try{Promise.resolve(context.registerTool({...t,annotations:{untrustedContentHint:false,...t.annotations}},{signal:lifecycle.signal})).catch(()=>{});}catch{}}addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}

</script></body></html>
